<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1224">
<title>Central de demandas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230C1224'/%3E%3Crect x='12' y='11' width='18' height='26' rx='2' fill='none' stroke='%23E7ECFA' stroke-width='3'/%3E%3Cpath d='M33 20h6M36 17l3 3-3 3' fill='none' stroke='%2322C08B' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/local/demandas/demandas-fontes.css">
<link rel="stylesheet" href="/local/demandas/demandas.css">
<style>
/* Casca da Central de demandas: a tela inteira é do módulo; aqui só o fundo, o botão de rede e o aviso. */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0C1224;color:#E7ECFA;font:14px "Segoe UI",system-ui,sans-serif}
main{display:grid;height:100vh;height:100dvh;grid-template-rows:minmax(0,1fr)}
[hidden]{display:none!important}
.cx-rede{position:fixed;left:12px;bottom:12px;z-index:70;border:1px solid #263457;background:#151E38;color:#93A0BF;border-radius:999px;padding:6px 12px;font:600 12px "Segoe UI",system-ui;cursor:pointer;opacity:.85}
.cx-rede:hover{opacity:1;color:#E7ECFA}
.cx-fundo{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(8,12,26,.6)}
.cx-box{width:min(460px,100%);background:#151E38;border:1px solid #263457;border-radius:18px;padding:20px;display:grid;gap:12px}
.cx-box h2{margin:0;font:700 19px "Segoe UI",system-ui}
.cx-box p{margin:0;color:#93A0BF;font-size:13px}
.cx-chk{display:flex;gap:8px;align-items:center;font-weight:600}
.cx-pin{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid #263457}
.cx-pin b{font-size:22px;letter-spacing:.25em;font-variant-numeric:tabular-nums}
.cx-pin small{grid-column:1/-1;color:#93A0BF}
.cx-box button{font:600 13px "Segoe UI",system-ui;border:1px solid #263457;background:#1B2645;color:#E7ECFA;border-radius:10px;padding:7px 12px;cursor:pointer}
.cx-box button:disabled{opacity:.4;cursor:not-allowed}
.cx-urls code{display:block;color:#6C8BFF;user-select:all;margin-top:2px}
.cx-msg{color:#E0A63A;font-size:13px;min-height:1em}
.cx-fim{display:flex;justify-content:flex-end}
.cx-toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:90;background:#E7ECFA;color:#0C1224;padding:9px 15px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<main data-view="demandas"></main>
<button type="button" class="cx-rede" id="cx-rede" hidden>⚙ Rede</button>
<div class="cx-fundo" id="cx-fundo" hidden>
  <div class="cx-box" role="dialog" aria-modal="true" aria-labelledby="cx-titulo">
    <h2 id="cx-titulo">Acesso pela rede</h2>
    <p>Outros computadores, celulares e tablets do mesmo Wi-Fi podem usar a Central de demandas, com PIN.</p>
    <label class="cx-chk"><input type="checkbox" id="cx-on"> Ligar o acesso pela rede</label>
    <div id="cx-pins">
      <div class="cx-pin"><span>PIN do escritório</span><b id="cx-pin"></b><small>Abre tudo, inclusive a Administração. Use só nos computadores do escritório.</small>
        <button type="button" id="cx-novo">Gerar PIN do escritório novo</button></div>
      <div class="cx-pin"><span>PIN dos operadores</span><b id="cx-pinop"></b><small>Abre só a tela de operador: pedir, aceitar e acompanhar solicitações.</small>
        <button type="button" id="cx-novoop">Gerar PIN dos operadores novo</button></div>
    </div>
    <div class="cx-urls" id="cx-urls"></div>
    <div class="cx-msg" id="cx-msg" role="status"></div>
    <div class="cx-fim"><button type="button" id="cx-fechar">Fechar</button></div>
  </div>
</div>
<div class="cx-toast" id="cx-toast" role="status" hidden></div>
<script src="/app.js"></script>
<script src="/local/demandas/demandas.js"></script>
</body>
</html>
